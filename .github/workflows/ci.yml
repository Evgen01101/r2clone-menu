name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Гигиена репозитория (CRLF у .bat, BOM у .ps1, JSON)
        shell: powershell
        run: .\tools\Test-Hygiene.ps1

      - name: Синтаксис скрипта
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\R2clone_menu.ps1", [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host ('строка ' + $_.Extent.StartLineNumber + ': ' + $_.Message) }
            exit 1
          }
          Write-Host "Синтаксис в порядке"

      - name: Установка модулей
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Pester
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 4.10.1
          $result = Invoke-Pester -Script .\tests -PassThru -Quiet
          Write-Host ('Пройдено: ' + $result.PassedCount + ', провалено: ' + $result.FailedCount)
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer
          $issues = Invoke-ScriptAnalyzer -Path .\R2clone_menu.ps1 -Settings .\PSScriptAnalyzerSettings.psd1
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "Замечаний линтера нет"
